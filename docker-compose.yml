services:
  erp-connector:
    build: .
    image: erp-connector-service:0.1.0
    container_name: erp-connector-service
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ERP_CONNECTOR_PORT:-3005}:3005"
    env_file:
      - .env
    networks: [pac-invoicing-v2]
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3005/salud').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

# La red la crea Infrastructure/docker-compose.yml: levantar eso primero.
networks:
  pac-invoicing-v2:
    external: true
